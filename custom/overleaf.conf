# Surcharge toGæther : injection de /togaether/likes.js (nonce CSP recopié depuis l'en-tête amont).
# Jeton de la passerelle interne (port 8082) : généré à l'installation (make config), jamais versionné.
# Définit $tg_token_ok (1 si l'en-tête X-Tg-Token est le bon).
include /etc/nginx/togaether/nginx-token.conf;
map $upstream_http_content_security_policy $tg_csp_nonce {
	"~nonce-(?<n>[A-Za-z0-9+/=]+)" $n;
	default "";
}

server {
	listen         80;
	server_name    _; # Catch all, see http://nginx.org/en/docs/http/server_names.html

	root /overleaf/services/web/public/;

	# block external access to prometheus /metrics
	location /metrics {
		internal;
	}

	# Terminal Claude (conteneur claude-terminal) : réservé à une session Overleaf connectée
	location = /togaether/_auth {
		internal;
		proxy_pass http://127.0.0.1:4000/user/personal_info;
		proxy_pass_request_body off;
		proxy_set_header Content-Length "";
		proxy_set_header Host $host;
	}
	location @tg_terminal_login {
		return 302 $scheme://$http_host/login;
	}
	# Contexte de sélection → ~/overleaf/selection.md, images déposées → ~/overleaf/images/ (même contrôle de session)
	location /togaether/terminal-ctx/ {
		auth_request /togaether/_auth;
		error_page 401 403 500 = @tg_terminal_login;
		resolver 127.0.0.11 valid=10s ipv6=off;
		set $tg_ctx http://claude-terminal:7682;
		proxy_pass $tg_ctx;
		client_max_body_size 20m;
	}
	location /togaether/terminal/ {
		auth_request /togaether/_auth;
		error_page 401 403 500 = @tg_terminal_login;
		resolver 127.0.0.11 valid=10s ipv6=off;
		set $tg_terminal http://claude-terminal:7681;
		proxy_pass $tg_terminal;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_read_timeout 1d;
		proxy_send_timeout 1d;
	}

	location /togaether/ {
		alias /overleaf/togaether/;
		expires -1;
	}

	location / {
		proxy_pass http://127.0.0.1:4000;
		proxy_http_version 1.1;
		proxy_set_header Accept-Encoding "";
		sub_filter '</head>' '<link rel="stylesheet" href="/togaether/theme.css?v=$msec"></head>';
		sub_filter '</body>' '<script nonce="$tg_csp_nonce" src="/togaether/likes.js?v=$msec"></script><script nonce="$tg_csp_nonce" src="/togaether/claude.js?v=$msec"></script><script nonce="$tg_csp_nonce" src="/togaether/compile-current.js?v=$msec"></script><script nonce="$tg_csp_nonce" src="/togaether/figure-drop.js?v=$msec"></script></body>';
		sub_filter_once on;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_read_timeout 10m;
		proxy_send_timeout 10m;
	}

	location /socket.io {
		proxy_pass http://127.0.0.1:3026;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection "upgrade";
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-Host $host;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_read_timeout 10m;
		proxy_send_timeout 10m;
	}

	location /stylesheets {
		expires 1y;
	}

	location /minjs {
		expires 1y;
	}

	location /img {
		expires 1y;
	}

  # handle output files for specific users
  location ~ ^/project/([0-9a-f]+)/user/([0-9a-f]+)/build/([0-9a-f-]+)/output/output\.([a-z.]+)$ {
		proxy_pass http://127.0.0.1:8080; # clsi-nginx.conf
		proxy_http_version 1.1;
  }
  # handle output files for anonymous users
  location ~ ^/project/([0-9a-f]+)/build/([0-9a-f-]+)/output/output\.([a-z.]+)$ {
		proxy_pass http://127.0.0.1:8080; # clsi-nginx.conf
		proxy_http_version 1.1;
  }
  # PDF range for specific users
  location ~ ^/project/([0-9a-f]+)/user/([0-9a-f]+)/content/([0-9a-f-]+/[0-9a-f]+)$ {
		proxy_pass http://127.0.0.1:8080; # clsi-nginx.conf
		proxy_http_version 1.1;
  }
  # PDF range for anonymous users
  location ~ ^/project/([0-9a-f]+)/content/([0-9a-f-]+/[0-9a-f]+)$ {
		proxy_pass http://127.0.0.1:8080; # clsi-nginx.conf
		proxy_http_version 1.1;
  }

  # block external access to metrics
  location ~* ^/metrics/?$ {
    return 404 'Not found';
  }

  # block external access to all health checks /health_check, /health_check/full, etc
  location ~* ^/health_check {
    return 404 'Not found';
  }

  # Load any extra configuration for this vhost
  include /etc/nginx/vhost-extras/overleaf/*.conf;
}

# Passerelle interne toGæther → document-updater (outil « overleaf » du terminal Claude).
# Port NON publié sur le Mac : joignable seulement depuis le réseau Docker, et avec le jeton.
server {
	listen 8082;
	allow 10.0.0.0/8;
	allow 172.16.0.0/12;
	allow 192.168.0.0/16;
	deny all;
	client_max_body_size 50m;
	if ($tg_token_ok != 1) { return 403; }
	location ~ "^/project/[0-9a-f]{24}/doc/[0-9a-f]{24}$" {
		proxy_pass http://127.0.0.1:3003;
		proxy_set_header Host localhost;
	}
	location / { return 404; }
}
